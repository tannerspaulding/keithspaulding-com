<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keith's Corner</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; text-align: center;
    background: #fff8e7; color: #2b2340;
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    padding: 16px;
  }
  h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 .25em; }
  p { font-size: clamp(1.1rem, 4vw, 1.5rem); margin: 0; }
  .star { display: inline-block; animation: wiggle 2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @media (prefers-reduced-motion: reduce) { .star { animation: none; } }
</style>
</head>
<body>
  <main>
    <h1><span class="star">&#9733;</span> Keith's Corner <span class="star">&#9733;</span></h1>
    <p>Something silly is coming soon!</p>
  </main>
</body>
</html>
