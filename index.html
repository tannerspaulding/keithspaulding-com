:root {
  --paper: #f6f3ec;
  --card: #fffdf8;
  --pen: #1f1d1a;
  --pencil: #77736b;
  --rule: #d9d3c6;
  --yolk: #f2cc1d;
  --fox: #ee6a1f;
  --bacon: #c8142c;
  --gum: #ff4f9a;
  --grape: #8c1f73;
  --sky: #8fb7d9;
  --leaf: #4fae4a;
  --hand: "Keith Hand", "Architects Daughter", "Chalkboard SE", "Comic Neue", system-ui, sans-serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--pen);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.45;
}
.nowrap { white-space: nowrap; }
.hand { font-family: var(--hand); text-transform: uppercase; letter-spacing: .03em; }
.swash {
  background: linear-gradient(180deg, transparent 52%, color-mix(in srgb, var(--c, var(--yolk)) 55%, transparent) 52%, color-mix(in srgb, var(--c, var(--yolk)) 55%, transparent) 88%, transparent 88%);
  padding: 0 .12em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.keith-art { mix-blend-mode: multiply; display: block; max-width: 100%; height: auto; }
.btn {
  font: 600 1rem/1 var(--sans);
  color: var(--card);
  background: var(--pen);
  border: 2px solid var(--pen);
  border-radius: 999px;
  padding: 14px 26px;
  cursor: pointer;
  transition: transform .08s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: translateY(2px); }
.btn:focus-visible, .slot:focus-visible { outline: 3px solid var(--yolk); outline-offset: 3px; }
.btn.ghost { background: var(--card); color: var(--pen); }

/* the card */
.card {
  --c: var(--yolk);
  background: var(--card);
  border: 2px solid var(--pen);
  border-radius: 18px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 1px 0 var(--pen), 0 18px 40px -24px rgba(31, 29, 26, .45);
  transform: rotate(-.6deg);
  transition: transform .2s ease-in;
}
.card.out { transform: rotate(-.6deg) rotateY(90deg); }
.card-top { display: flex; justify-content: space-between; align-items: baseline; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--pencil); font-variant-numeric: tabular-nums; }
.card-name { margin: 0; font-family: var(--hand); text-transform: uppercase; letter-spacing: .03em; font-size: 2rem; line-height: 1.05; font-weight: 400; }
.art {
  position: relative;
  border: 1.5px solid var(--pen);
  border-radius: 12px;
  background: #fff;
  aspect-ratio: 200 / 210;
  display: grid;
  place-items: center;
  overflow: hidden;
  cursor: pointer;
}
.art svg { width: 92%; height: 92%; }
.art img { width: 78%; height: 92%; object-fit: contain; }
.art.boing > * { animation: boing .5s ease; }
@keyframes boing { 30% { transform: scale(1.08, .92); } 60% { transform: scale(.95, 1.06); } }
.badge {
  position: absolute; left: 10px; top: 10px;
  font: 600 .7rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase;
  background: var(--yolk); color: var(--pen); border: 1.5px solid var(--pen); border-radius: 999px; padding: 6px 10px;
}
.chat { display: flex; flex-direction: column; gap: 8px; min-height: 56px; }
.line { animation: pop .22s ease-out; max-width: 92%; }
.line.them { font-family: var(--hand); font-size: 1.3rem; line-height: 1.25; }
.line.them.punch { font-size: 1.5rem; }
.line.you { align-self: flex-end; background: #efebe2; border-radius: 14px 14px 4px 14px; padding: 7px 12px; font-size: .95rem; }
.badum { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--pencil); }
@keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
#say { width: 100%; background: var(--card); color: var(--pen); }
#say.next { background: var(--pen); color: var(--card); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; border-top: 1.5px dashed var(--rule); padding-top: 10px; }
.stats div { display: flex; flex-direction: column; gap: 2px; }
.stats dt { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--pencil); }
.stats dd { margin: 0; letter-spacing: .12em; font-size: .95rem; }
.stats dd b { color: var(--c); font-weight: 400; }
.stats dd i { color: var(--rule); font-style: normal; }

@media (prefers-reduced-motion: reduce) {
  .card, .line { transition: none; animation: none; }
  .art.boing > * { animation: none; }
}

.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding-block: 22px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.mast { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 8px; }
.mast h1 { margin: 0; font-family: var(--hand); font-weight: 400; text-transform: uppercase; letter-spacing: .02em; line-height: .95; font-size: clamp(2.3rem, 11vw, 3.4rem); text-wrap: balance; }
.mast h1 small { display: block; font-size: .42em; letter-spacing: .08em; color: var(--pencil); }
.mast p { grid-column: 1 / -1; margin: 4px 0 0; color: var(--pencil); max-width: 36ch; }
.mascot { width: clamp(88px, 26vw, 120px); transform: rotate(6deg); }
.stage { perspective: 1200px; }
#deal { align-self: stretch; font-size: 1.1rem; padding: 16px; }
.shelf { display: flex; flex-direction: column; gap: 12px; border-top: 2px solid var(--pen); padding-top: 16px; }
.shelf-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.shelf h2 { margin: 0; font-family: var(--hand); font-weight: 400; text-transform: uppercase; font-size: 1.4rem; }
.shelf .count { color: var(--pencil); font-size: .9rem; font-variant-numeric: tabular-nums; }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
.slot {
  font: 600 .7rem/1 var(--sans); color: var(--pencil);
  aspect-ratio: 200 / 210; border-radius: 8px; border: 1.5px dashed var(--rule);
  background: transparent; padding: 2px; display: grid; place-items: center; cursor: default;
  font-variant-numeric: tabular-nums;
}
.slot.got { border: 1.5px solid var(--pen); background: #fff; cursor: pointer; }
.slot svg, .slot img { width: 100%; height: 100%; object-fit: contain; }
footer { color: var(--pencil); font-size: .85rem; text-align: center; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="keithPen" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="wrap">
  <header class="mast">
    <h1><small>Keith's</small><span class="nowrap">Giggle</span> <span class="nowrap">Cards</span></h1>
    <img class="mascot keith-art" src="assets/keith-sunny.webp" alt="Sunbun, drawn by Keith">
    <p>52 creatures drawn the way Keith draws. Deal one and it tells you a joke.</p>
  </header>

  <button class="btn" id="deal" type="button">Deal a card</button>

  <div class="stage"><article class="card" id="card" aria-live="polite"></article></div>

  <section class="shelf" aria-labelledby="shelf-title">
    <div class="shelf-head"><h2 id="shelf-title">The deck</h2><span class="count" id="count"></span></div>
    <div class="dex" id="dex"></div>
  </section>

  <footer>Every creature is an original, drawn in Keith's style. Cards 1 to 3 are Keith's own drawings.</footer>
</div>

<script>
window.ASSET_BASE = "assets/";
/* Keith-style creature renderer + the 52-card deck.
   Style rules (from Keith's drawings): thin black pen outline, marker scribble fill
   that runs past the lines, tall pencil-gray eyes with white highlight blobs,
   tiny nose (often with a red tip), usually no mouth, little nub feet and ears. */
var KEITH = (function () {
  "use strict";
  var PEN = "#1f1d1a";
  var C = {
    yolk: "#f2cc1d", fox: "#ee6a1f", bacon: "#c8142c", gum: "#ff4f9a", grape: "#8c1f73",
    sky: "#8fb7d9", leaf: "#4fae4a", toast: "#b9773a", cream: "#f3e2b3", pencil: "#9a9a9a", white: "#ffffff"
  };

  function rng(seed) {
    var a = seed * 2654435761 >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function f(n) { return Math.round(n * 10) / 10; }

  // closed smooth path through points (Catmull-Rom -> cubic bezier)
  function smooth(pts) {
    var n = pts.length, d = "M" + f(pts[0][0]) + " " + f(pts[0][1]);
    for (var i = 0; i < n; i++) {
      var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      d += " C" + f(p1[0] + (p2[0] - p0[0]) / 6) + " " + f(p1[1] + (p2[1] - p0[1]) / 6) + " " +
        f(p2[0] - (p3[0] - p1[0]) / 6) + " " + f(p2[1] - (p3[1] - p1[1]) / 6) + " " + f(p2[0]) + " " + f(p2[1]);
    }
    return d + " Z";
  }

  var SHAPES = {
    blob:   { rx: 60, ry: 54, cy: 112 },
    bean:   { rx: 48, ry: 62, cy: 108 },
    wide:   { rx: 72, ry: 44, cy: 118 },
    star:   { rx: 64, ry: 64, cy: 108, r: function (t) { return 0.74 + 0.26 * Math.cos(5 * (t + Math.PI / 2)); } },
    cloud:  { rx: 62, ry: 54, cy: 110, r: function (t) { return 0.88 + 0.12 * Math.abs(Math.cos(4 * t)); } },
    drop:   { rx: 54, ry: 58, cy: 116, r: function (t) { var s = Math.max(0, -Math.sin(t)); return 1 + 0.45 * Math.pow(s, 6); } },
    berry:  { rx: 56, ry: 56, cy: 104, r: function (t) { var s = Math.max(0, Math.sin(t)); return 1 + 0.35 * Math.pow(s, 5); } },
    square: { rx: 58, ry: 56, cy: 110, p: 4.5 },
    pill:   { rx: 74, ry: 38, cy: 116, p: 2.6 },
    tall:   { rx: 34, ry: 70, cy: 104, p: 2.8 },
    tri:    { rx: 66, ry: 66, cy: 98, tri: true }

      line(L[current.step], "them", lastLine);
      if (lastLine && !current.c.knock) {
        var t = document.createElement("div"); t.className = "badum"; t.textContent = "ba-dum-tss";
        document.getElementById("chat").appendChild(t);
      }
      busy = false; say.disabled = false; updateSay();
    }, 450);
  }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function show(c) {
    if (reduce) { render(c); return; }
    card.classList.add("out");
    setTimeout(function () { render(c); card.classList.add("out"); void card.offsetWidth; card.classList.remove("out"); }, 200);
  }
  function deal() { show(pick()); }

  function renderDex() {
    var dex = document.getElementById("dex");
    dex.innerHTML = DECK.map(function (c) {
      var got = found.indexOf(c.n) >= 0;
      return got
        ? '<button type="button" class="slot got" data-n="' + c.n + '" title="' + CARDUI.esc(c.name) + '" aria-label="Show ' + CARDUI.esc(c.name) + '">' + CARDUI.art(c, 2) + '</button>'
        : '<span class="slot" aria-label="Card ' + c.n + ', not found yet">' + CARDUI.pad(c.n) + '</span>';
    }).join("");
    document.getElementById("count").textContent = found.length + " of 52 found";
  }
  document.getElementById("dex").addEventListener("click", function (e) {
    var b = e.target.closest(".slot.got");
    if (!b) return;
    var c = DECK.filter(function (x) { return x.n === +b.dataset.n; })[0];
    if (c) { show(c); card.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" }); }
  });
  document.getElementById("deal").addEventListener("click", deal);
  render(pick());
})();
</script>
</body>
</html>
