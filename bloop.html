/* Layout: Bloop is a dark little stage, like a real pad machine at night. The pads are the only loud thing,
   chunky rubber squares with thick ink outlines and Keith's hand lettering. One committed dark look. */
:root {
  --bg: #17141d; --panel: #221e2a; --raise: #2e2938; --line: #3a3445; --fg: #f4f0e8; --mute: #a59fae;
  --ink: #0b0a0e; --yellow: #ffd23f; --red: #e8322b; --hot: #ff5a4f;
  --hand: "Keith Hand", "Chalkboard SE", "Comic Neue", system-ui, sans-serif;
  --ui: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; color: var(--fg); font: 16px/1.4 var(--ui); -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior: none;
  background: var(--bg) radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1.2px, transparent 1.6px) 0 0 / 14px 14px; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; display: block; flex: none; }

.bl { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding-block: 8px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bl-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 44px; flex: none; }
.bl-ibtn { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 10px 0 6px; border: 0; border-radius: 12px; background: transparent;
  color: var(--mute); font-size: .92rem; font-weight: 600; text-decoration: none; -webkit-tap-highlight-color: transparent; }
.bl-ibtn:active { background: var(--raise); }
.bl-home { justify-self: start; }
.bl-beatsbtn { justify-self: end; padding: 0 10px; gap: 6px; color: var(--fg); background: var(--panel); }
.bl-beatsbtn svg.i { width: 19px; height: 19px; }
.bl-brand { display: flex; align-items: center; gap: 8px; font-family: var(--hand); font-size: 1.55rem; line-height: 1; letter-spacing: .02em; }
.bl-mark { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 24px; height: 24px; padding: 2px; background: var(--ink); border-radius: 7px; transform: rotate(-6deg); }
.bl-mark i { border-radius: 3px; display: block; }
.bl-mark i:nth-child(1) { background: var(--yellow); } .bl-mark i:nth-child(2) { background: #ff4fa0; }
.bl-mark i:nth-child(3) { background: #2f7bff; } .bl-mark i:nth-child(4) { background: var(--red); }

/* sound sets */
.bl-kits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; background: var(--panel); border-radius: 14px; flex: none; }
.bl-kit { height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--mute); font-family: var(--hand); font-size: 1.05rem; line-height: 1; padding: 0 4px; white-space: nowrap; }
.bl-kit[aria-selected="true"] { background: var(--kc, var(--yellow)); color: var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }

/* voice row */
.bl-mic { display: flex; align-items: center; gap: 10px; flex: none; }
.bl-micbtn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px 0 10px; border-radius: 19px; border: 2px solid var(--line); background: var(--panel); font-weight: 700; font-size: .92rem; flex: none; }
.bl-micbtn[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.bl-mic p { margin: 0; font-size: .85rem; line-height: 1.25; color: var(--mute); min-width: 0; }

/* loop strip: one cell per sixteenth note, four to a beat */
.bl-strip { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; flex: none; }
.bl-cell { position: relative; height: 24px; border: 0; padding: 0; border-radius: 6px; background: var(--panel); display: flex; align-items: center; justify-content: center; gap: 2px; overflow: hidden; }
.bl-cell.beat { background: var(--raise); }
.bl-cell.bar2 { height: 20px; }
.bl-cell i { width: 5px; height: 5px; border-radius: 50%; background: var(--dc); display: block; flex: none; }
.bl-cell.now { box-shadow: inset 0 0 0 2px var(--fg); }
.bl-strip.steps .bl-cell { height: 34px; }
.bl-strip.steps .bl-cell.bar2 { height: 30px; }
.bl-cell.lit { background: var(--sc); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.bl-cell.lit.now { box-shadow: inset 0 0 0 2px var(--fg); }

/* pads: the grid fills whatever height is left, as a square */
.bl-padwrap { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.bl-pads { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: clamp(7px, 2.4vw, 12px);
  width: 100%; aspect-ratio: 1; max-width: 100%; max-height: 100%; }
@supports (width: 1cqmin) { .bl-pads { width: 100cqmin; height: 100cqmin; aspect-ratio: auto; } }
.bl-pad { position: relative; min-width: 0; min-height: 0; border: 3px solid var(--ink); border-radius: 18% 16% 19% 15% / 16% 19% 15% 18%; padding: 0;
  background: var(--pc); color: var(--pf); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  box-shadow: inset 0 -7px 0 rgba(0,0,0,.26), 0 4px 0 var(--ink); transition: transform .07s ease, filter .07s ease, box-shadow .07s ease; overflow: hidden; }
.bl-pad::before { content: ""; position: absolute; left: 12%; top: 10%; width: 30%; height: 14%; border-top: 3px solid rgba(255,255,255,.55); border-radius: 50% 50% 0 0 / 100% 100% 0 0; transform: rotate(-12deg); pointer-events: none; }
.bl-pad .nm { position: absolute; left: 9%; right: 6%; bottom: 9%; font-family: var(--hand); font-size: clamp(.78rem, 3.5vw, 1.12rem); line-height: 1; text-align: left; pointer-events: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bl-pad.on { transform: translateY(3px) scale(.97); filter: brightness(1.2) saturate(1.1); box-shadow: inset 0 -3px 0 rgba(0,0,0,.22), 0 1px 0 var(--ink), 0 0 26px 2px var(--pc); }
.bl-pad.sel { outline: 3px dashed var(--fg); outline-offset: 3px; }
.bl-pad.empty { background: var(--panel); color: var(--mute); border-color: var(--line); border-style: dashed; box-shadow: none; }
.bl-pad.empty::before { display: none; }
.bl-pad .wave { position: absolute; left: 8%; right: 8%; top: 22%; height: 38%; width: 84%; pointer-events: none; overflow: visible; }
.bl-pad .wave path { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; opacity: .75; vector-effect: non-scaling-stroke; }
.bl-pad.recording { background: var(--red); border-style: solid; border-color: var(--ink); color: #fff; animation: bl-pulse .7s ease-in-out infinite alternate; }
@keyframes bl-pulse { to { box-shadow: 0 0 0 6px rgba(232,50,43,.35), 0 0 30px rgba(232,50,43,.6); } }
.bl.micon .bl-pad { border-style: dashed; }

/* transport */
.bl-trans { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 10px; align-items: center; flex: none; }
.bl-play, .bl-rec { width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; padding: 0; box-shadow: 0 4px 0 var(--ink); }
.bl-play:active, .bl-rec:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.bl-play { background: var(--yellow); color: var(--ink); }
.bl-play svg { width: 26px; height: 26px; fill: currentColor; }
.bl-play .st, .bl-play.going .pl { display: none; } .bl-play.going .st { display: block; }
.bl-rec { background: var(--raise); }
.bl-rec i { width: 20px; height: 20px; border-radius: 50%; background: var(--red); display: block; }
.bl-rec[aria-pressed="true"] { background: var(--red); animation: bl-recglow .5s ease-in-out infinite alternate; }
.bl-rec[aria-pressed="true"] i { background: #fff; }
@keyframes bl-recglow { to { box-shadow: 0 4px 0 var(--ink), 0 0 22px rgba(232,50,43,.7); } }
.bl-tempo { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; height: 56px; background: var(--panel); border-radius: 16px; padding: 0 4px; }
.bl-tempo button { width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: grid; place-items: center; }
.bl-tempo button:active { background: var(--raise); }
.bl-bpm { text-align: center; line-height: 1; min-width: 0; }
.bl-bpm b { display: block; font-family: var(--hand); font-size: 1.6rem; font-weight: 400; font-variant-numeric: tabular-nums; }
.bl-bpm span { display: block; font-size: .7rem; color: var(--mute); margin-top: 3px; white-space: nowrap; }

.bl-tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex: none; }
.bl-tool { height: 52px; border: 0; border-radius: 14px; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .74rem; font-weight: 600; color: var(--mute); padding: 0; }
.bl-tool svg.i { color: var(--fg); }
.bl-tool:active { background: var(--raise); }
.bl-tool[aria-pressed="true"] { background: var(--fg); color: var(--ink); }
.bl-tool[aria-pressed="true"] svg.i { color: var(--ink); }
.bl-tool:disabled { opacity: .4; }
.bl-save { background: var(--raise); }

/* sheets */
.bl-scrim { position: fixed; inset: 0; background: rgba(5,4,8,.6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.bl-scrim.open { opacity: 1; pointer-events: auto; }
.bl-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; max-height: 86%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--panel); border-radius: 22px 22px 0 0; padding: 14px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; gap: 12px; }
.bl-sheet.open { transform: none; }
.bl-sheethead { display: flex; align-items: center; justify-content: space-between; }
.bl-sheethead h2 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: 1.6rem; }
.bl-text { border: 0; background: transparent; color: var(--yellow); font-weight: 700; height: 40px; padding: 0 6px; }
.bl-field { display: flex; flex-direction: column; gap: 6px; font-size: .82rem; color: var(--mute); font-weight: 600; }
.bl-field input { height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); font: 600 1.05rem var(--ui); padding: 0 12px; }
.bl-primary { height: 52px; border: 3px solid var(--ink); border-radius: 16px; background: var(--yellow); color: var(--ink); font-weight: 800; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 var(--ink); }
.bl-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.bl-cap { margin: 6px 0 -4px; font-size: .8rem; font-weight: 700; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
.bl-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bl-act { height: 48px; border: 0; border-radius: 14px; background: var(--raise); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; }
.bl-act:disabled { opacity: .5; }
.bl-note { margin: 0; font-size: .82rem; color: var(--mute); line-height: 1.35; }
.bl-list { display: flex; flex-direction: column; gap: 8px; }
.bl-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; background: var(--bg); border-radius: 14px; padding: 8px 8px 8px 14px; }
.bl-row.cur { box-shadow: inset 0 0 0 2px var(--yellow); }
.bl-row b { display: block; font-family: var(--hand); font-weight: 400; font-size: 1.15rem; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bl-row span { display: block; font-size: .78rem; color: var(--mute); margin-top: 2px; }
.bl-row button { height: 40px; border: 0; border-radius: 11px; background: var(--raise); padding: 0 12px; font-weight: 700; font-size: .88rem; }
.bl-row button.open { background: var(--yellow); color: var(--ink); }
.bl-row button.del.sure { background: var(--red); color: #fff; }
.bl-empty { margin: 0; color: var(--mute); font-size: .9rem; text-align: center; padding: 10px 0; }

.bl-toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 10px); z-index: 30; max-width: min(92vw, 420px);
  background: var(--fg); color: var(--ink); font-weight: 700; font-size: .9rem; padding: 10px 16px; border-radius: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center; }
.bl-toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-height: 640px) {
  .bl { gap: 8px; }
  .bl-tool { height: 46px; }
  .bl-play, .bl-rec, .bl-tempo { height: 50px; } .bl-play, .bl-rec { width: 50px; }
}
@media (prefers-reduced-motion: reduce) {
  .bl-pad, .bl-sheet, .bl-scrim, .bl-toast { transition: none; }
  .bl-pad.recording, .bl-rec[aria-pressed="true"] { animation: none; }
}

</style>
</head>
<body>

<div class="bl" id="bl">
  <header class="bl-bar">
    <a class="bl-ibtn bl-home" href="./" aria-label="Back to my apps"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Home</a>
    <div class="bl-brand"><span class="bl-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Bloop</div>
    <button class="bl-ibtn bl-beatsbtn" id="beatsBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>My beats</button>
  </header>

  <div class="bl-kits" id="kits" role="tablist" aria-label="Sound sets"></div>

  </div>

  <div class="bl-strip" id="strip" aria-label="Your loop"></div>

  <main class="bl-padwrap" id="padwrap">
    <div class="bl-pads" id="pads" aria-label="Pads"></div>
  </main>

  <div class="bl-trans">
    <button class="bl-play" id="playBtn" type="button" aria-label="Play"><svg viewBox="0 0 24 24" class="pl"><path d="M8 5.5v13l10.5-6.5z"/></svg><svg viewBox="0 0 24 24" class="st"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg></button>

    <div class="bl-tempo" aria-label="Speed">
      <button type="button" id="slower" aria-label="Slower"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <div class="bl-bpm"><b id="bpm">100</b><span>beats a minute</span></div>
      <button type="button" id="faster" aria-label="Faster"><svg class="i" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    </div>
  </div>

  <nav class="bl-tools" aria-label="Loop tools">
    <button class="bl-tool" id="stepsBtn" type="button" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="8" width="4" height="8" rx="1.2"/><rect x="10" y="8" width="4" height="8" rx="1.2"/><rect x="17" y="8" width="4" height="8" rx="1.2"/></svg><span>Steps</span></button>
    <button class="bl-tool" id="barsBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0113.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 01-13.7 5.6L4 15M4 20v-5h5"/></svg><span id="barsLbl">1 bar</span></button>
    <button class="bl-tool" id="undoBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg><span>Undo</span></button>
    <button class="bl-tool" id="clearBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Clear</span></button>
    <button class="bl-tool bl-save" id="saveBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 19h14"/></svg><span>Save</span></button>

</div>

<div class="bl-scrim" id="scrim"></div>

<section class="bl-sheet" id="saveSheet" aria-label="Save this beat" aria-hidden="true">

  <div class="bl-acts">
    <button class="bl-act" id="shareGo" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v5.5A2.5 2.5 0 007.5 21h9a2.5 2.5 0 002.5-2.5V13"/></svg>Share</button>
    <button class="bl-act" id="dlGo" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 19h14"/></svg>Download</button>

<div class="bl-toast" id="toast" role="status"></div>

<script>
/* Keith's site stats: counts only, for the family's private stats page.
   Sends: a random id made on this device, which app is open, how many times things were tapped
   (cards dealt, squares colored, pads hit, files saved), how many cards, drawings and beats are kept
   on this device (numbers only), phone/tablet/computer, home-screen app or browser, the kind of
   website that sent someone here (search, social, typed) on the first visit only, and how long this
   visit lasted under its own random id.
   Never sends drawings, beats, voice recordings, names or anything typed.
   Only runs on keith-spaulding.com, never in a preview. Honors Do Not Track and Global Privacy Control.
   Fails quietly: the apps never wait on it. Every call gives up after 6 seconds, and after a failure it
   waits 1, 2, 4... up to 60 minutes before trying again, keeping its counts meanwhile.

   In the apps:  KS.open("dd")  KS.ev("dd", "deal")  KS.card(12, 0|1|2)  (dealt, punch line, caught) */
(function () {
  var API = "https://keith-stats.tannerspaulding81.workers.dev";
  var IDK = "ks-id", QK = "ks-q", BK = "ks-wait", SK = "ks-visit", FK = "ks-first";
  var noop = function () {};
  var host = location.hostname.replace(/^www\./, "");
  var off = host !== "keith-spaulding.com" || navigator.doNotTrack === "1" || window.doNotTrack === "1" || navigator.globalPrivacyControl === true;
  if (off) { window.KS = { on: false, open: noop, ev: noop, card: noop, send: noop }; return; }

  var get = function (k, s) { try { return (s || localStorage).getItem(k); } catch (e) { return null; } };
  var set = function (k, v, s) { try { if (v == null) (s || localStorage).removeItem(k); else (s || localStorage).setItem(k, v); } catch (e) {} };
  var json = function (k, d, s) { try { return JSON.parse(get(k, s) || "null") || d; } catch (e) { return d; } };
  var rid = function (n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return (b % 36).toString(36); }).join(""); };

  function id() { var v = get(IDK); if (!v || !/^[a-z0-9]{16,40}$/.test(v)) { v = rid(24); set(IDK, v); if (get(IDK) !== v) return null; } return v; }
  // One visit lasts until the tab has been away for 30 minutes, across the home screen and every app.
  var vis = json(SK, null, sessionStorage), t0 = Date.now();
  if (!vis || !vis.id || t0 - (vis.last || 0) > 1800000) { var d = new Date(); vis = { id: rid(16), h: d.getHours(), d: d.getDay(), secs: 0, last: t0 }; }
  var active = (vis.secs || 0) * 1000, lastTick = t0;
  function tick() { var n = Date.now(); if (document.visibilityState === "visible") active += Math.min(n - lastTick, 5000); lastTick = n; vis.secs = Math.round(active / 1000); vis.last = n; set(SK, JSON.stringify(vis), sessionStorage); }

  // counts wait here until the server says it has them
  var Q = json(QK, { e: {}, c: {} }); if (!Q.e) Q.e = {}; if (!Q.c) Q.c = {};
  var dirty = false, keepT = 0;
  function keep() { clearTimeout(keepT); keepT = setTimeout(function () { set(QK, JSON.stringify(Q)); }, 800); }
  function device() { var w = Math.min(screen.width, screen.height); return /Mobi|Android|iPhone/i.test(navigator.userAgent) ? (w >= 600 ? "tablet" : "phone") : (navigator.maxTouchPoints > 1 && w >= 600 ? "tablet" : "computer"); }
  function mode() { return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone ? "app" : "browser"; }
  // only the kind of place that sent someone, never the address
  function source() {
    var r = document.referrer, h = ""; if (!r) return "direct";
    try { h = new URL(r).hostname.replace(/^www\./, ""); } catch (e) { return "other"; }
    if (h === host) return "direct";
    var m = [["search:google", /(^|\.)google\./], ["search:bing", /(^|\.)bing\.com$/], ["search:duckduckgo", /duckduckgo\.com$/], ["search:yahoo", /yahoo\./],
      ["search:ecosia", /ecosia\.org$/], ["search:brave", /search\.brave\.com$/], ["social:facebook", /(^|\.)(facebook\.com|fb\.com|messenger\.com)$/],
      ["social:instagram", /instagram\.com$/], ["social:youtube", /youtube\.com$|youtu\.be$/], ["social:reddit", /reddit\.com$/], ["social:pinterest", /pinterest\./],
      ["social:tiktok", /tiktok\.com$/], ["social:x", /(^|\.)(t\.co|x\.com|twitter\.com)$/], ["social:linkedin", /linkedin\.com$|lnkd\.in$/], ["social:discord", /discord(app)?\.com$/],
      ["family:mitchell", /mitchellspaulding\.com$|quackersgame\.com$/], ["github", /github\.(com|io)$/]];
    for (var i = 0; i < m.length; i++) if (m[i][1].test(h)) return m[i][0];
    return "other";
  }
  function have() {
    var dd = json("doodle-deck-v1", []), px = json("pixelry-v1", []), bl = json("bloop-beats-v1", []);
    return { dd: Array.isArray(dd) ? dd.length : 0, px: Array.isArray(px) ? px.filter(function (x) { return x && !x.ex; }).length : 0, bl: Array.isArray(bl) ? bl.filter(function (x) { return x && x.id !== "example"; }).length : 0 };
  }

  // back-off after a failure
  var wait = function () { return json(BK, { until: 0, n: 0 }); };
  function failed() { var w = wait(), n = Math.min((w.n || 0) + 1, 7); set(BK, JSON.stringify({ until: Date.now() + Math.min(60000 * Math.pow(2, n - 1), 3600000), n: n })); }

  var app = "home", busy = false, lastSent = 0, sentSecs = -1;
  function send(leaving) {
    var me = id(); if (!me || busy || Date.now() < (wait().until || 0)) return;
    tick();
    var keys = Object.keys(Q.e).length + Object.keys(Q.c).length;
    if (!keys && vis.secs - sentSecs < 60 && lastSent) return;   // nothing new worth a request
    var e = Q.e, c = Q.c; Q = { e: {}, c: {} }; set(QK, JSON.stringify(Q));
    var data = { id: me, app: app, dev: device(), mode: mode(), wd: navigator.webdriver ? 1 : 0, s: { id: vis.id, h: vis.h, d: vis.d, secs: vis.secs }, e: e, c: c, have: have() };
    if (!get(FK)) data.src = source();
    var back = function () { for (var k in e) Q.e[k] = (Q.e[k] || 0) + e[k];
      for (var n in c) { var a = Q.c[n] || [0, 0, 0]; Q.c[n] = [a[0] + c[n][0], a[1] + c[n][1], Math.max(a[2], c[n][2])]; } set(QK, JSON.stringify(Q)); };
    busy = true;
    var ctl = window.AbortController ? new AbortController() : null, tm = ctl ? setTimeout(function () { ctl.abort(); }, 6000) : 0;
    // text/plain keeps this a simple request, so the browser doesn't spend an extra request asking first
    fetch(API + "/v1/ping", { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(data), keepalive: !!leaving, credentials: "omit", signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error("not ok"); set(BK, null); set(FK, "1"); lastSent = Date.now(); sentSecs = vis.secs; if (j.slow) back(); })
      .catch(function () { back(); failed(); })
      .then(function () { busy = false; clearTimeout(tm); });
  }
  var soonT = 0;
  function soon(ms) { clearTimeout(soonT); soonT = setTimeout(send, ms); }

  var KS = {
    on: true,
    open: function (a) { app = a; KS.ev(a, "open"); soon(1500); },
    ev: function (a, name, n) { var k = a + "." + name; Q.e[k] = (Q.e[k] || 0) + (n || 1); keep(); },
    card: function (n, which) { var a = Q.c[n] || [0, 0, 0]; if (which === 2) a[2] = 1; else a[which]++; Q.c[n] = a; keep(); },
    send: send,
  };
  window.KS = KS;
  setInterval(tick, 1000);
  setInterval(function () { if (document.visibilityState === "visible") send(); }, 120000);
  document.addEventListener("visibilitychange", function () { tick(); if (document.visibilityState === "hidden") { set(QK, JSON.stringify(Q)); send(true); } });
  window.addEventListener("pagehide", function () { tick(); set(QK, JSON.stringify(Q)); });
})();

/* Bloop sound engine. Every sound is made in the browser with Web Audio (no recorded samples), so the same
   code plays live on an AudioContext and renders a beat to a file on an OfflineAudioContext.
   SND.play(ctx, out, kitId, padIndex, time, clip) schedules one hit. */
var SND = (function () {
  var noiseBufs = typeof WeakMap === "function" ? new WeakMap() : null;
  function noiseBuf(ctx) {
    var b = noiseBufs && noiseBufs.get(ctx);
    if (!b) {
      var n = Math.floor(ctx.sampleRate * 2); b = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = b.getChannelData(0); for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      if (noiseBufs) noiseBufs.set(ctx, b);
    }
    return b;
  }
  function G(ctx, out, v) { var g = ctx.createGain(); g.gain.value = v == null ? 1 : v; g.connect(out); return g; }
  // percussive envelope: quick rise to peak, exponential fall
  function env(ctx, out, t, peak, dec, att) {
    var g = ctx.createGain(); att = att || 0.002;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t + att + dec); g.connect(out); return g;
  }
  // held envelope: rise, hold, release
  function hold(ctx, out, t, peak, len, rel) {
    var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.setValueAtTime(peak, t + len); g.gain.exponentialRampToValueAtTime(0.0001, t + len + rel); g.connect(out); return g;
  }
  function O(ctx, out, type, f, t, dur) {
    var o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.connect(out); o.start(t); o.stop(t + dur + 0.05); return o;
  }
  function N(ctx, out, t, dur) {
    var s = ctx.createBufferSource(); s.buffer = noiseBuf(ctx); s.connect(out); s.start(t, Math.random()); s.stop(t + dur + 0.05); return s;
  }
  function F(ctx, out, type, f, q) { var b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; b.connect(out); return b; }
  function lfo(ctx, param, rate, depth, t, dur, type) {
    var o = ctx.createOscillator(), g = ctx.createGain(); o.type = type || "sine"; o.frequency.value = rate; g.gain.value = depth;
    o.connect(g); g.connect(param); o.start(t); o.stop(t + dur + 0.05);
  }
  function sweep(p, a, b, t, d, lin) { p.setValueAtTime(a, t); if (lin) p.linearRampToValueAtTime(b, t + d); else p.exponentialRampToValueAtTime(b, t + d); }
  // six detuned squares through filters: the classic metallic cymbal recipe
  function metal(ctx, out, t, dur) {
    var hp = F(ctx, out, "highpass", 7000), bp = F(ctx, hp, "bandpass", 10000, 0.8);
    [263, 400, 421, 474, 587, 845].forEach(function (f) { O(ctx, bp, "square", f * 1.4, t, dur); });
  }

  var D = {
    kick: function (c, o, t) { var g = env(c, o, t, 1, 0.42); var s = O(c, g, "sine", 150, t, 0.45); sweep(s.frequency, 150, 44, t, 0.12);
      var k = env(c, o, t, 0.35, 0.015); O(c, k, "triangle", 900, t, 0.02); },
    boom: function (c, o, t) { var g = env(c, o, t, 0.95, 1.1, 0.004); var s = O(c, g, "sine", 70, t, 1.2); sweep(s.frequency, 70, 41, t, 0.14);
      var g2 = env(c, o, t, 0.18, 0.6); var s2 = O(c, g2, "triangle", 140, t, 0.6); sweep(s2.frequency, 140, 82, t, 0.14); },
    snare: function (c, o, t) { var n = env(c, F(c, o, "highpass", 1300), t, 0.55, 0.19); N(c, n, t, 0.22);
      var g = env(c, o, t, 0.45, 0.1); var s = O(c, g, "triangle", 210, t, 0.12); sweep(s.frequency, 210, 160, t, 0.08); },
    clap: function (c, o, t) { var bp = F(c, o, "bandpass", 1500, 1.2);
      [0, 0.011, 0.022].forEach(function (d) { N(c, env(c, bp, t + d, 0.7, 0.012), t + d, 0.02); });
      N(c, env(c, bp, t + 0.03, 0.6, 0.16), t + 0.03, 0.2); },
    hat: function (c, o, t) { metal(c, env(c, o, t, 0.32, 0.05), t, 0.07); },
    ohat: function (c, o, t) { metal(c, env(c, o, t, 0.3, 0.34), t, 0.4); },
    shaker: function (c, o, t) { N(c, env(c, F(c, o, "bandpass", 6500, 1.4), t, 0.5, 0.07, 0.018), t, 0.12); },
    tamb: function (c, o, t) { var g = env(c, o, t, 0.25, 0.2); metal(c, g, t, 0.22); N(c, env(c, F(c, o, "highpass", 9000), t, 0.3, 0.16), t, 0.2); },
    tom: function (f) { return function (c, o, t) { var g = env(c, o, t, 0.8, 0.32); var s = O(c, g, "sine", f, t, 0.36); sweep(s.frequency, f, f * 0.62, t, 0.3);
      N(c, env(c, F(c, o, "lowpass", 2500), t, 0.08, 0.04), t, 0.05); }; },
    rim: function (c, o, t) { O(c, env(c, o, t, 0.45, 0.03), "triangle", 1750, t, 0.04); N(c, env(c, F(c, o, "highpass", 4000), t, 0.25, 0.015), t, 0.03); },
    cowbell: function (c, o, t) { var bp = F(c, env(c, o, t, 0.3, 0.3), "bandpass", 800, 1.5); O(c, bp, "square", 540, t, 0.32); O(c, bp, "square", 800, t, 0.32); },

    var idx = -1; st.events.forEach(function (ev, k) { if (ev.s === s && ev.k === st.kit && ev.p === sel) idx = k; });
    pushUndo();
    if (idx >= 0) st.events.splice(idx, 1);
    else { var ev = { s: s, k: st.kit, p: sel }; if (c) ev.c = c; st.events.push(ev); if (ensure()) SND.play(ctx, out, ev.k, ev.p, ctx.currentTime, clipFor(ev)); }
    changed();
  }

  /* ---------- kits ---------- */
  function renderKits() {
    var k = $("kits"); k.innerHTML = "";
    SND.KITS.forEach(function (kit) {
      var b = document.createElement("button"); b.type = "button"; b.className = "bl-kit"; b.textContent = kit.name; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", kit.id === st.kit ? "true" : "false"); b.style.setProperty("--kc", KIT_COLORS[kit.id]);
      b.addEventListener("click", function () { setKit(kit.id); }); k.appendChild(b);
    });
  }
  function setKit(id) {
    if (id !== "mine" && micOn) setMic(false);
    st.kit = id; sel = -1; persist(); renderKits(); renderPads(); renderStrip();
    $("micRow").hidden = id !== "mine";
  }

  /* ---------- transport ---------- */
  function renderTransport() {
    $("playBtn").classList.toggle("going", playing); $("playBtn").setAttribute("aria-label", playing ? "Stop" : "Play");
    $("recBtn").setAttribute("aria-pressed", recording ? "true" : "false");
    $("bpm").textContent = st.bpm; $("barsLbl").textContent = st.bars === 1 ? "1 bar" : "2 bars";
    $("stepsBtn").setAttribute("aria-pressed", stepsMode ? "true" : "false");
    $("undoBtn").disabled = !undo.length;
  }
  $("playBtn").addEventListener("click", function () { if (playing) stop(); else { start(); KS.ev("bl", "play"); } });
  $("recBtn").addEventListener("click", function () {
    if (micOn) setMic(false);
    recording = !recording;
    if (recording) { KS.ev("bl", "rec"); if (stepsMode) { stepsMode = false; sel = -1; renderPads(); renderStrip(); } if (!playing) start(); toast("Recording! Tap pads to add them to the loop."); }
    renderTransport();
  });
  function tempo(d) { st.bpm = Math.max(60, Math.min(180, st.bpm + d)); persist(); renderTransport(); }
  [["slower", -5], ["faster", 5]].forEach(function (x) {
    var b = $(x[0]), rep = 0, wait = 0;
    var end = function () { clearTimeout(wait); clearInterval(rep); };
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); tempo(x[1]); wait = setTimeout(function () { rep = setInterval(function () { tempo(x[1]); }, 90); }, 400); });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (n) { b.addEventListener(n, end); });
    b.addEventListener("click", function (e) { if (e.detail === 0) tempo(x[1]); });
  });
  $("stepsBtn").addEventListener("click", function () {
    stepsMode = !stepsMode; if (stepsMode) { recording = false; if (micOn) setMic(false); }
    sel = -1; renderTransport(); renderPads(); renderStrip();
    if (stepsMode) { KS.ev("bl", "steps"); toast("Tap a pad, then tap the steps to switch it on or off."); }
  });
  $("barsBtn").addEventListener("click", function () {
    pushUndo();
    if (st.bars === 1) { st.bars = 2; st.events = st.events.concat(st.events.map(function (ev) { var c = {}; for (var k in ev) c[k] = ev[k]; c.s += 16; return c; })); toast("2 bars. I copied your loop into the second bar."); }
    else { st.bars = 1; st.events = st.events.filter(function (ev) { return ev.s < 16; }); toast("Back to 1 bar."); }
    nextStep %= nsteps(); renderTransport(); changed();
  });
  $("undoBtn").addEventListener("click", function () {
    if (!undo.length) return; var u = JSON.parse(undo.pop()); st.events = u.events; st.bars = u.bars; nextStep %= nsteps(); renderTransport(); changed();
  });
  $("clearBtn").addEventListener("click", function () {
    if (!st.events.length) { toast("Nothing to clear yet."); return; }
    pushUndo(); st.events = []; changed(); toast("Cleared. Undo brings it back.");
  });

  /* ---------- my voice ---------- */
  var micStream = null, rec = null;
  function setMic(on) {
    if (!on) { micOn = false; if (micStream) micStream.getTracks().forEach(function (t) { t.stop(); }); micStream = null; renderMic(); renderPads(); return; }
    if (inViewer()) { toast("Recording your voice works on keith-spaulding.com."); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast("This browser can't record sound."); return; }
    ensure();
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } }).then(function (s) {
      micStream = s; micOn = true; if (recording) { recording = false; renderTransport(); } if (stepsMode) { stepsMode = false; renderTransport(); renderStrip(); }
      renderMic(); renderPads();
    }, function () { toast("I need the microphone. Allow it for this site, then try again."); });
  }
  function renderMic() {
    $("micBtn").setAttribute("aria-pressed", micOn ? "true" : "false"); $("micLbl").textContent = micOn ? "Done" : "Record";
    $("micHint").textContent = micOn ? "Hold a pad and talk. Let go to stop (3 seconds max)." : "Tap Record, then hold a pad and say something silly.";
  }
  $("micBtn").addEventListener("click", function () { setMic(!micOn); });
  function startRec(i, el, e) {
    if (rec || !micStream || !ensure()) return;
    try { el.setPointerCapture(e.pointerId); } catch (er) {}
    var src = ctx.createMediaStreamSource(micStream), sp = ctx.createScriptProcessor(4096, 1, 1), z = ctx.createGain(), chunks = [];
    z.gain.value = 0; sp.onaudioprocess = function (ev) { chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0))); };
    src.connect(sp); sp.connect(z); z.connect(ctx.destination);
    rec = { i: i, el: el, src: src, sp: sp, z: z, chunks: chunks, timer: setTimeout(endRec, 3000) };
    el.classList.add("recording"); el.querySelector(".nm").textContent = "Talk!";
    var end = function () { el.removeEventListener("pointerup", end); el.removeEventListener("pointercancel", end); endRec(); };
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  }
  function endRec() {
    if (!rec) return; var r = rec; rec = null; clearTimeout(r.timer);
    try { r.src.disconnect(); r.sp.disconnect(); r.z.disconnect(); } catch (e) {}
    r.el.classList.remove("recording");
    var len = 0; r.chunks.forEach(function (c) { len += c.length; });
    var d = new Float32Array(len), o = 0; r.chunks.forEach(function (c) { d.set(c, o); o += c.length; });
    var sr = ctx.sampleRate, a = 0, b = d.length - 1, th = 0.02;
    while (a < d.length && Math.abs(d[a]) < th) a++;
    while (b > a && Math.abs(d[b]) < th) b--;
    a = Math.max(0, a - Math.floor(sr * 0.01)); b = Math.min(d.length, b + Math.floor(sr * 0.06));
    if (b - a < sr * 0.08) { renderPads(); toast("I didn't hear anything. Hold the pad and talk."); return; }
    d = d.slice(a, b);
    var peak = 0; for (var i = 0; i < d.length; i++) peak = Math.max(peak, Math.abs(d[i]));
    var g = Math.min(8, 0.9 / (peak || 1)), f = Math.floor(sr * 0.004);
    for (i = 0; i < d.length; i++) { var w = Math.min(1, i / f, (d.length - 1 - i) / f); d[i] *= g * w; }
    var id = uid(); clips[id] = { sr: sr, data: d }; mine[r.i] = id; store(KEY_MINE, mine);
    idbDo("readwrite", function (s) { s.put({ id: id, sr: sr, data: d }); }).catch(function () {});
    SND.play(ctx, out, "mine", r.i, ctx.currentTime + 0.05, clips[id]); flash(r.i);
    renderPads(); gc(); KS.ev("bl", "voice");
  }
  // forget recordings that no pad, loop or saved beat uses anymore
  function gc() {
    var keep = {}; mine.forEach(function (id) { if (id) keep[id] = 1; });
    st.events.concat.apply(st.events, beats.map(function (bt) { return bt.events; })).forEach(function (ev) { if (ev.c) keep[ev.c] = 1; });
    Object.keys(clips).forEach(function (id) { if (!keep[id]) { delete clips[id]; idbDo("readwrite", function (s) { s.delete(id); }).catch(function () {}); } });
  }
  function loadClips() {
    return idbDo("readonly", function (s) { return s.getAll(); }).then(function (all) {
      (all || []).forEach(function (c) { if (c && c.data) clips[c.id] = { sr: c.sr, data: c.data }; });
    }).catch(function () {});
  }

  /* ---------- sheets ---------- */
  var openSheet = null;
  function sheet(id) {
    if (openSheet) { $(openSheet).classList.remove("open"); $(openSheet).setAttribute("aria-hidden", "true"); }
    openSheet = id; $("scrim").classList.toggle("open", !!id);
    if (id) { $(id).classList.add("open"); $(id).setAttribute("aria-hidden", "false"); }
  }
  $("scrim").addEventListener("click", function () { sheet(null); });
  $("saveClose").addEventListener("click", function () { sheet(null); });
  $("beatsClose").addEventListener("click", function () { sheet(null); });

  function nextName() { var n = beats.length + 1, names = beats.map(function (b) { return b.name; }); while (names.indexOf("Beat " + n) >= 0) n++; return "Beat " + n; }
  var file = null, fileFor = "";
  $("saveBtn").addEventListener("click", function () {
    $("nameIn").value = st.name || nextName(); sheet("saveSheet"); prepFile();
  });
  $("saveGo").addEventListener("click", function () {
    var name = $("nameIn").value.trim() || nextName();
    var existing = st.id && beats.filter(function (b) { return b.id === st.id; })[0];
    var data = { name: name, bpm: st.bpm, bars: st.bars, events: JSON.parse(JSON.stringify(st.events)) };
    if (existing) { for (var k in data) existing[k] = data[k]; existing.updated = Date.now(); }
    else { data.id = uid(); data.created = Date.now(); beats.unshift(data); st.id = data.id; }
    st.name = name; store(KEY_BEATS, beats); persist(); sheet(null); KS.ev("bl", "save"); toast("Saved " + name + " to My beats.");
  });
  function sig() { return JSON.stringify([st.bpm, st.bars, st.events]); }
  function prepFile() {
    var share = $("shareGo"), dl = $("dlGo");
    if (inViewer()) { share.disabled = dl.disabled = true; $("fileNote").textContent = "Sound files save on keith-spaulding.com. This preview can't save files."; return; }
    if (!st.events.length) { share.disabled = dl.disabled = true; $("fileNote").textContent = "Make a loop first, then you can turn it into a sound file."; return; }
    var canShare = !!(navigator.share && navigator.canShare); share.hidden = !canShare;
    $("fileNote").textContent = "The sound file plays your loop a few times over.";
    if (file && fileFor === sig()) { share.disabled = dl.disabled = false; return; }
    share.disabled = dl.disabled = true; $("fileNote").textContent = "Getting the sound file ready...";
    var want = sig();
    render().then(function (blob) {
      var nm = (($("nameIn").value.trim() || "my beat").replace(/[^\w\- ]+/g, "").trim() || "my beat") + ".wav";
      try { file = new File([blob], nm, { type: "audio/wav" }); } catch (e) { file = blob; file.name = nm; }
      fileFor = want; share.disabled = dl.disabled = false; $("fileNote").textContent = "The sound file plays your loop a few times over.";
    }, function () { $("fileNote").textContent = "I couldn't make the sound file on this device."; });
  }
  function render() {
    var spb = sd(), steps = nsteps(), loop = steps * spb, reps = Math.max(2, Math.min(4, Math.ceil(8 / loop))), sr = 44100;
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; if (!OAC) return Promise.reject();
    var oc = new OAC(2, Math.ceil((loop * reps + 1.6) * sr), sr), m = SND.master(oc), evs = st.events.slice();
    for (var r = 0; r < reps; r++) evs.forEach(function (ev) { if (ev.s < steps) SND.play(oc, m, ev.k, ev.p, 0.02 + r * loop + ev.s * spb, clipFor(ev)); });
    var p = oc.startRendering();
    return (p && p.then ? p : new Promise(function (res) { oc.oncomplete = function (e) { res(e.renderedBuffer); }; })).then(SND.wav);
  }
  $("shareGo").addEventListener("click", function () {
    if (!file) return;
    if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: $("nameIn").value.trim() || "My beat" }).then(function () { KS.ev("bl", "share"); }, function () {});
    else download();
  });
  $("dlGo").addEventListener("click", download);
  function download() {
    if (!file) return; KS.ev("bl", "dl");
    var u = URL.createObjectURL(file), a = document.createElement("a"); a.href = u; a.download = file.name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 5000); toast("Downloading " + file.name);
  }

  $("beatsBtn").addEventListener("click", function () { renderBeats(); sheet("beatsSheet"); });
  function renderBeats() {
    var list = $("beatList"); list.innerHTML = "";
    if (!beats.length) { var p = document.createElement("p"); p.className = "bl-empty"; p.textContent = "No saved beats yet. Make a loop and tap Save."; list.appendChild(p); return; }
    beats.forEach(function (bt) {
      var row = document.createElement("div"); row.className = "bl-row" + (bt.id === st.id ? " cur" : "");
      var info = document.createElement("div"), b = document.createElement("b"), s = document.createElement("span");
      b.textContent = bt.name; s.textContent = (bt.bars === 1 ? "1 bar" : "2 bars") + " · " + bt.bpm + " beats a minute"; info.appendChild(b); info.appendChild(s);
      var open = document.createElement("button"); open.type = "button"; open.className = "open"; open.textContent = "Open";
      open.addEventListener("click", function () {
        stop(); pushUndo(); st.bpm = bt.bpm; st.bars = bt.bars; st.events = JSON.parse(JSON.stringify(bt.events)); st.id = bt.id; st.name = bt.name;
        sheet(null); renderTransport(); changed(); KS.ev("bl", "reopen"); toast("Opened " + bt.name + ". Tap play!");
      });
      var del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "Delete"; del.setAttribute("aria-label", "Delete " + bt.name);
      del.addEventListener("click", function () {
        if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "Sure?"; setTimeout(function () { del.classList.remove("sure"); del.textContent = "Delete"; }, 2500); return; }
        beats = beats.filter(function (x) { return x !== bt; }); if (st.id === bt.id) st.id = null; store(KEY_BEATS, beats); persist(); gc(); renderBeats();
      });
      row.appendChild(info); row.appendChild(open); row.appendChild(del); list.appendChild(row);
    });
  }
  $("newBeat").addEventListener("click", function () {
    stop(); pushUndo(); st.events = []; st.bars = 1; st.bpm = 100; st.id = null; st.name = "";
    sheet(null); renderTransport(); changed(); KS.ev("bl", "new"); toast("New beat. Tap the pads!");
  });

  /* ---------- toast, keys, lifecycle ---------- */
  var toastT = 0;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 2400); }
  var KEYS = "1234qwerasdfzxcv";
  document.addEventListener("keydown", function (e) {
    if (e.repeat || openSheet || e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
    var i = KEYS.indexOf(e.key.toLowerCase());
    if (i >= 0) { e.preventDefault(); press(i); }
    else if (e.key === " " && document.activeElement === document.body) { e.preventDefault(); if (playing) stop(); else start(); }
  });
  document.addEventListener("pointerdown", function () { ensure(); }, { capture: true, passive: true });
  document.addEventListener("visibilitychange", function () { if (document.hidden) { if (playing) stop(); if (micOn) setMic(false); } });

  buildPads(); reindex(); renderKits(); renderPads(); renderStrip(); renderTransport(); renderMic();
  KS.open("bl");
  $("micRow").hidden = st.kit !== "mine";
  loadClips().then(function () { renderPads(); });
  window.__bloop = { st: function () { return st; }, beats: function () { return beats; }, render: render };
})();

</script>
